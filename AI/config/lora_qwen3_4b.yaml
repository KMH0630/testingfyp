# mlx_lm.lora 設定檔（QLoRA：因為 model 係 4-bit 量化版本）
# 用法：mlx_lm.lora --config config/lora_qwen3_4b.yaml

model: "mlx-community/Qwen3-4B-Instruct-2507-4bit"
train: true
data: "data/final"            # 內含 train.jsonl / valid.jsonl / test.jsonl
adapter_path: "adapters/caremate_v1"

fine_tune_type: lora
num_layers: 16                # 只喺最後 16 層加 LoRA；記憶體唔夠可以減到 8
batch_size: 2                 # 16GB Mac 用 1–2；32GB 可以試 4
iters: 1000                   # 約 = 樣本數 × epoch ÷ batch_size，先試 1000
learning_rate: 1.0e-4
max_seq_length: 2048
grad_checkpoint: true         # 用時間換記憶體
mask_prompt: true             # 只計最後一句 assistant 回覆嘅 loss

steps_per_report: 10
steps_per_eval: 100
val_batches: 25
save_every: 200
seed: 42

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 16
  scale: 20.0
  dropout: 0.05
