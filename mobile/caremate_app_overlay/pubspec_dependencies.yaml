# 將以下內容加入 pubspec.yaml 嘅 dependencies:（或者用 flutter pub add 指令）
dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  record: any            # 錄音（iOS 用 AVAudioRecorder，輸出 m4a/AAC）
  path_provider: any     # 搵暫存資料夾
  http: any              # 上載去 FastAPI
  file_picker: any       # 揀手機入面現有嘅 mp3
